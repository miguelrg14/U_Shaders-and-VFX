name: Build

# Two Unity projects live in this repo:
#   BiRP_Shader-Notes  -> WebGL build on GitHub Pages (every push to main) + Windows build in Releases
#   URP_VFX-Notes      -> Windows build in Releases (VFX Graph needs compute shaders, which WebGL lacks)
# - Every tag v* (e.g. v1.0.0): Windows 64-bit builds of both projects attached to a GitHub Release.
# - Can also be started by hand from the Actions tab.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
# Required once: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: ShaderNotes
  WEB_PROJECT: BiRP_Shader-Notes

jobs:
  webgl:
    name: WebGL build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.WEB_PROJECT }}/Library
          key: Library-WebGL-${{ hashFiles('BiRP_Shader-Notes/Assets/**', 'BiRP_Shader-Notes/Packages/**', 'BiRP_Shader-Notes/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.WEB_PROJECT }}
          targetPlatform: WebGL
          buildName: ${{ env.BUILD_NAME }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/${{ env.BUILD_NAME }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: webgl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  windows:
    name: Windows build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: BiRP_Shader-Notes
            name: ShaderNotes
          - project: URP_VFX-Notes
            name: VFXNotes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/Library
          key: Library-Win64-${{ matrix.project }}-${{ hashFiles(format('{0}/Assets/**', matrix.project), format('{0}/Packages/**', matrix.project), format('{0}/ProjectSettings/**', matrix.project)) }}
          restore-keys: Library-Win64-${{ matrix.project }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ matrix.project }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ matrix.name }}
          buildsPath: build/${{ matrix.name }}

      - name: Zip build
        run: |
          cd build/${{ matrix.name }}/StandaloneWindows64
          zip -r "../../../${{ matrix.name }}-Windows64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-Windows64
          path: ${{ matrix.name }}-Windows64.zip

  release:
    name: GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows64'
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*-Windows64.zip'
          generate_release_notes: true
